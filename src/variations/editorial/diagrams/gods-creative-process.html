<body>
<h1>From world to show.</h1>
<div class="diagram">

<title id="gods-ribbon-title">From worldbuilding to a live-show concept</title>
<desc id="gods-ribbon-desc">Creative development runs from worldbuilding through visual development to show concept; source, approach, and outcome rows trace how the idea takes shape.</desc>
<defs>
  <linearGradient id="gg-col1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a2424"/><stop offset="18%" stop-color="#292929"/><stop offset="100%" stop-color="#262626"/></linearGradient>
  <linearGradient id="gg-col2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#331a1f"/><stop offset="18%" stop-color="#252022"/><stop offset="100%" stop-color="#211a1c"/></linearGradient>
  <linearGradient id="gg-col3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#421018"/><stop offset="18%" stop-color="#1a1012"/><stop offset="100%" stop-color="#140c0e"/></linearGradient>
</defs>
<style>.gg-primary{font:500 16px 'Archivo Narrow',Arial,sans-serif;fill:#c9c9cf}.gg-body{font:11px 'Geist Mono',monospace;fill:#a1a1aa}.gg-meta{font:10px 'Geist Mono',monospace;fill:#a1a1aa;letter-spacing:.6px}.gg-meta-red{font:10px 'Geist Mono',monospace;fill:#f3263e;letter-spacing:.55px}</style>

<text x="1016" y="38" text-anchor="middle" class="gg-meta-red">SHOW CONCEPT</text>

<rect x="416" y="48" width="388" height="244" fill="url(#gg-col2)"/>

<text x="48" y="198" class="gg-meta" text-anchor="middle" transform="rotate(-90 48 198)" fill="#ef4444">APPROACH</text>

<text x="84" y="98" class="gg-primary">Mythology &amp; story</text><text x="84" y="122" class="gg-body">Gods / guardians / hidden worlds</text>
<text x="436" y="98" class="gg-primary">Chosen worlds</text><text x="436" y="122" class="gg-body">Scale / atmosphere / key reveals</text>
<text x="832" y="98" class="gg-primary" fill="#fecaca">Visual sequences</text><text x="832" y="122" class="gg-body">Movement / light / perspective</text>

<text x="84" y="178" class="gg-primary">Art direction</text><text x="84" y="202" class="gg-body">Concept art and story development</text>

<text x="436" y="258" class="gg-primary">A visual language</text><text x="436" y="282" class="gg-body">Materials, scale, and movement</text>
<text x="832" y="258" class="gg-primary" fill="#fca5a5">A connected show concept</text><text x="832" y="282" class="gg-body">Sequences designed to unfold together</text>
